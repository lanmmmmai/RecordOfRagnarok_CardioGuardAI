[env:esp32-s3-touch-lcd-128]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600   ; must match Serial.begin() in main.cpp
upload_speed = 921600
upload_port = COM13
monitor_port = COM13

; Configurations for ESP32-S3R2 (2MB PSRAM + 16MB Flash)
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qio

; Build flags for Waveshare ESP32-S3-Touch-LCD-1.28
build_flags = 
    -I "${PROJECT_DIR}/include"
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; TFT_eSPI Hardware Pin Mapping for GC9A01 on ESP32-S3 (SPI3_HOST / USE_HSPI_PORT)
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=12
    -D TFT_MOSI=11
    -D TFT_SCLK=10
    -D TFT_CS=9
    -D TFT_DC=8
    -D TFT_RST=14
    -D TFT_BL=2
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=80000000
    -D USE_HSPI_PORT=1
    ; ASCII fonts. Kept as the fallback path: if a smooth font fails to load,
    ; drawString() falls back to the font number passed at each call site, so
    ; the watch loses its diacritics but stays readable.
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; Anti-aliased Unicode fonts. Required for Vietnamese: the fonts above are
    ; ASCII only, so every accented character rendered as garbage without this.
    ; See src/ui/vn_font.cpp and tools/make_vlw.py.
    -D SMOOTH_FONT=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    ; NimBLE instead of the default Bluedroid stack: it saves roughly 50 KB of
    ; RAM, which matters because the 240x240 sprite already costs 115 KB.
    h2zero/NimBLE-Arduino @ ^1.4.2
    links2004/WebSockets @ ^2.4.1
    ; Not linked into the build. Kept as the reference for QMI8658 register
    ; meanings; the driver in src/sensors/qmi8658_service.cpp is raw I2C.
    https://github.com/lewisxhe/SensorLib.git
